services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biometric
      POSTGRES_USER: biometric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biometric}
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/02_analytics.sql:/docker-entrypoint-initdb.d/02_analytics.sql:ro
  web:
    image: python:3.12-slim
    depends_on: [db]
    restart: unless-stopped   # DB 가 준비되기 전에 뜨면 재시도
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && python web/server.py --host 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://biometric:${POSTGRES_PASSWORD:-biometric}@db:5432/biometric
      VIEWER_USER: ${VIEWER_USER:-admin}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app:ro
volumes:
  pgdata:
